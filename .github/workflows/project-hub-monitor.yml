name: Project Hub Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'link-hub/public/data/**'
      - 'link-hub/public/artifacts/**'
      - 'link-hub/monitor/**'
      - '.github/workflows/project-hub-monitor.yml'
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: project-hub-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install screenshot engine
        working-directory: link-hub
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check public links and refresh previews
        working-directory: link-hub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node monitor/check-sites.mjs

      - name: Commit real changes only
        shell: bash
        run: |
          git add link-hub/public/data/sites.json link-hub/public/data/catalog.json link-hub/public/previews || true
          if git diff --cached --quiet; then
            echo "No monitored changes detected."
            exit 0
          fi
          git config user.name "Olaf Project Hub Monitor"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(project-hub): refresh verified links and previews"
          git push
