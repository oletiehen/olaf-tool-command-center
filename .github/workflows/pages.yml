name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /olaf-tool-command-center
      NEXT_PUBLIC_SITE_URL: https://oletiehen.github.io
      NEXT_PUBLIC_PUBLICATION_URL: https://oletiehen.github.io/olaf-tool-command-center/
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Statische App bauen
        run: npm run build:pages
      - name: Statische Routen prüfen
        run: node --test tests/static-export.test.mjs
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6
      - name: Seiten-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
