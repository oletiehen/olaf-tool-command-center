name: Project Hub Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'link-hub/public/**'
      - 'link-hub/monitor/**'
      - '.github/workflows/project-hub-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: node --check link-hub/public/assets/app.js

      - name: Validate JSON data
        run: |
          node -e "const fs=require('fs'); const sites=JSON.parse(fs.readFileSync('link-hub/public/data/sites.json','utf8')); const catalog=JSON.parse(fs.readFileSync('link-hub/public/data/catalog.json','utf8')); if(!Array.isArray(sites.sites)) throw new Error('sites.json: sites missing'); if(!Array.isArray(catalog.items)) throw new Error('catalog.json: items missing'); console.log('sites', sites.sites.length, 'catalog', catalog.items.length);"
          node link-hub/monitor/validate-public-data.mjs

      - name: Check required workspace files
        run: |
          test -f link-hub/public/index.html
          test -f link-hub/public/assets/styles.css
          test -f link-hub/public/assets/workspace.css
          test -f link-hub/public/assets/app.js
          test -f link-hub/public/apps/persoenliche-webseite/index.html
          test -f link-hub/public/apps/persoenliche-webseite/robots.txt
          test -n "$(find link-hub/public/apps/persoenliche-webseite/assets -name '*.js' -print -quit)"
          test -n "$(find link-hub/public/apps/persoenliche-webseite/assets -name '*.css' -print -quit)"
          grep -q 'DEIN DIGITALER LEITSTAND' link-hub/public/index.html
          grep -q 'catalog.json' link-hub/public/assets/app.js
          grep -q 'Olaf Tiehen · Persönliches digitales Zuhause' link-hub/public/apps/persoenliche-webseite/index.html

      - name: Check public-edition privacy boundary
        run: |
          grep -Fq '<meta name="robots" content="noindex, nofollow, noarchive"' link-hub/public/apps/persoenliche-webseite/index.html
          grep -Fxq 'Disallow: /' link-hub/public/apps/persoenliche-webseite/robots.txt
          grep -Fq 'path: /apps/persoenliche-webseite/*' render.yaml
          grep -Fq 'value: "noindex, nofollow, noarchive"' render.yaml
          node -e "const fs=require('fs'); const catalog=JSON.parse(fs.readFileSync('link-hub/public/data/catalog.json','utf8')); const item=catalog.items.find(({id})=>id==='olaf-personal-website'); if(!item) throw new Error('personal website missing'); if(item.status!=='active') throw new Error('personal website not active'); const link=item.links?.find(({kind})=>kind==='live'); if(link?.url!=='https://olaf-projektzentrale.onrender.com/apps/persoenliche-webseite/') throw new Error('unexpected personal website URL'); if(link.lastHttpStatus!==200) throw new Error('personal website not verified');"
          if find link-hub/public/apps/persoenliche-webseite -type f \( -iname '*.avif' -o -iname '*.gif' -o -iname '*.jpeg' -o -iname '*.jpg' -o -iname '*.mp4' -o -iname '*.png' -o -iname '*.svg' -o -iname '*.webm' -o -iname '*.webp' \) -print -quit | grep -q .; then
            echo 'Unexpected media file in personal public edition.'
            exit 1
          fi

      - name: Serve static hub
        run: |
          python3 -m http.server 4173 --directory link-hub/public >/tmp/project-hub-http.log 2>&1 &
          echo $! >/tmp/project-hub-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/tmp/project-hub-index.html
          curl --fail --silent http://127.0.0.1:4173/data/sites.json >/tmp/project-hub-sites.json
          curl --fail --silent http://127.0.0.1:4173/data/catalog.json >/tmp/project-hub-catalog.json
          curl --fail --silent http://127.0.0.1:4173/apps/persoenliche-webseite/ >/tmp/persoenliche-webseite-index.html
          grep -q 'Alles im Blick' /tmp/project-hub-index.html
          grep -q 'Persönliches digitales Zuhause' /tmp/persoenliche-webseite-index.html
          kill $(cat /tmp/project-hub-http.pid)
